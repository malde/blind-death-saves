name: Release module

on: 
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    # Replace version and changelog/download URL in the module.json
    - name: Replace version and changelog/download URL in the module.json
      id: replace_version_and_download
      run: |
        jq \
          --arg version "${{ github.event.release.tag_name }}" \
          --arg changelog "https://github.com/malde/blind-death-saves/blob/${{ github.event.release.tag_name }}/CHANGELOG.md" \
          --arg download "https://github.com/malde/blind-death-saves/releases/download/${{ github.event.release.tag_name }}/module.zip" \
          '.version = $version | .changelog = $changelog | .download = $download' \
          module.json > module.json.tmp
        mv module.json.tmp module.json

    # Zip module files
    - run: zip -r ./module.zip module.json scripts/ i18n/ CHANGELOG.md README.md

    # Create release for the version
    - name: Append files to release
      id: create_release
      uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1.21.0
      with:
        allowUpdates: true
        name: ${{ github.event.release.name }}
        draft: false
        prerelease: false
        token: ${{ secrets.GITHUB_TOKEN }}
        artifacts: './module.json, ./module.zip, ./CHANGELOG.md, ./README.md'
        tag: ${{ github.event.release.tag_name }}
        body: ${{ github.event.release.body }}
